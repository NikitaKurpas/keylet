name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release toolchain
        run: python3 -c 'import sys; sys.path.insert(0, "scripts"); import release; release.check_tools()'
      - run: make test
      - run: make smoke
