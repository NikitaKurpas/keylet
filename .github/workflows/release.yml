name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing trusted vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: keylet-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', os.environ['RELEASE_TAG']):
              raise SystemExit('A version tag is required')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify trusted main ancestry and exact tag
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      # Recovery may check out an old tag whose release helper predates this gate.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Require successful main CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import sys
          sys.path.insert(0, '.release-tools/scripts')
          import release
          release.check_ci(sys.argv[1])
          PY
      - name: Recover already published assets on retry
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/keylet-release-state; then
            if test "$(cat /tmp/keylet-release-state)" = false; then
              mkdir -p dist
              gh release download "$RELEASE_TAG" --dir dist --pattern 'Keylet-*-arm64.zip*'
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Verify recovered signature and notarization
        if: steps.published.outputs.exists == 'true'
        env:
          DEVELOPER_ID_IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import sys
          sys.path.insert(0, '.release-tools/scripts')
          import release
          release.verify_recovered(sys.argv[1])
          PY
      - name: Credential-free tests and bundle
        if: steps.published.outputs.exists != 'true'
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import release; release.check_tools()'
          make test
          make smoke
          make bundle
      - name: Sign and notarize
        if: steps.published.outputs.exists != 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          DEVELOPER_ID_IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        run: python3 scripts/release.py prepare "$RELEASE_TAG"
      - name: Publish verified release
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish "$RELEASE_TAG"
      - name: Update personal tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, '.release-tools/scripts')
          import release
          release.ROOT = Path.cwd()
          release.update_tap(sys.argv[1])
          PY
